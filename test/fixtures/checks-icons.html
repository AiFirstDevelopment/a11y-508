<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon-only controls - a11y-508 test site</title>
<!--
  Plan item 7 (6.A). The icon classes insert private-use characters (U+E900, U+E901) the way
  icon fonts do; no font is loaded, which changes nothing for assistive technology. A glyph is
  not a name: the bare link and the bare button are unnamed. Visible text or aria-label names
  them. CSS-generated words still name a control ("Close" below), as they do in Chrome.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus { outline: 3px solid #f90; }
  .icon { font-style: normal; display: inline-block; min-width: 1em; }
  .icon-home::before { content: "\e900"; }
  .icon-gear::before { content: "\e901"; }
  .css-close::before { content: "Close"; }
  .controls a, .controls button { margin-right: 16px; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>Icon-only controls</h1>
  <p class="controls">
    <a href="/" id="icon-bare"><i class="icon icon-home"></i></a>
    <button type="button" id="icon-button"><i class="icon icon-gear"></i></button>
    <a href="/" id="icon-text"><i class="icon icon-home"></i> Home</a>
    <a href="/" id="icon-label" aria-label="Home"><i class="icon icon-home"></i></a>
    <button type="button" id="css-words" class="css-close"></button>
  </p>
</main>
</body>
</html>
