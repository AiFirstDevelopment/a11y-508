<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARIA attribute names and values - a11y-508 test site</title>
<!--
  Plan rules 1 and 2 (5.C), from the WAI-ARIA 1.2 attribute definitions. aria-labeledby is not an
  attribute (edit distance 1 from aria-labelledby); aria-expanded takes true, false or undefined;
  aria-level is an integer; aria-controls must name an id on the page. The same attributes with
  valid values are not reported.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus, input:focus, select:focus { outline: 3px solid #f90; }
  .box { display: inline-block; width: 40px; height: 40px; background: #58a; margin: 4px; }
  .slot { display: block; min-height: 24px; margin: 6px 0; border: 1px solid #888; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>ARIA attribute names and values</h1>
  <p id="at-heading">Billing address</p>
  <div id="at-misspelled" aria-labeledby="at-heading">Street and city go here.</div>
  <button type="button" id="at-expanded-yes" aria-expanded="yes">Account menu</button>
  <div role="heading" id="at-level-x" aria-level="x">Shipping</div>
  <button type="button" id="at-controls-missing" aria-controls="at-nowhere">Toggle filters</button>
  <button type="button" id="at-expanded-ok" aria-expanded="true" aria-controls="at-panel">Hide filters</button>
  <div id="at-panel">Filters panel</div>
  <div role="heading" id="at-level-ok" aria-level="2">Payment</div>
</main>
</body>
</html>
