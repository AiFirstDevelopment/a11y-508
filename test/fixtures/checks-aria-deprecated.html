<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deprecated ARIA - a11y-508 test site</title>
<!--
  Plan rule 11 (5.C review). role="directory" is deprecated in WAI-ARIA 1.2 (use list);
  aria-grabbed is deprecated with no replacement attribute. role="list" is not reported.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus, input:focus, select:focus { outline: 3px solid #f90; }
  .box { display: inline-block; width: 40px; height: 40px; background: #58a; margin: 4px; }
  .slot { display: block; min-height: 24px; margin: 6px 0; border: 1px solid #888; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>Deprecated ARIA</h1>
  <ul role="directory" id="dp-directory"><li>Chapter one</li><li>Chapter two</li></ul>
  <div id="dp-grabbed" aria-grabbed="false" draggable="true">Drag this card</div>
  <div role="list" id="dp-list"><div role="listitem">Item one</div><div role="listitem">Item two</div></div>
</main>
</body>
</html>
