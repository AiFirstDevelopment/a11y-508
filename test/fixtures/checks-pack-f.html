<!doctype html>
<html lang="jp">
<head>
<meta charset="utf-8">
<title>Language codes - a11y-508 test site</title>
<!--
  Round 4a pack F (plan items 14-15). lang="jp" on html is an 11.A violation naming ja (jp is a
  country code). Inner lang="en-US", "zh-Hant" and "haw" (Hawaiian has no two-letter code) are
  valid. lang="fra" with text is an 11.B review item naming fr. lang="xx" is an 11.B violation on
  an element with text, and not reported on an empty one.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus, input:focus, select:focus, summary:focus { outline: 3px solid #f90; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>Language codes</h1>
  <p><span lang="en-US" id="pf-en-us">Color</span>, <span lang="zh-Hant" id="pf-zh-hant">中文</span>, <span lang="haw" id="pf-haw">Aloha</span>.</p>
  <p><span lang="fra" id="pf-fra">Bonjour</span>.</p>
  <p><span lang="xx" id="pf-xx-empty"></span><span lang="xx" id="pf-xx">Unknown words</span>.</p>
</main>
</body>
</html>
