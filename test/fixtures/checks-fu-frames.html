<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frames, details - a11y-508 test site</title>
<!--
  Follow-up round item 7. The page and its same-origin frame each hold text whose color lies
  between an image's bounds (13.C "text over images"): the page gets one such item, listing
  #fu-between and the frame's #fb-between with the frame prefix and frame. The frame's 7.A image
  inventory names its image with the frame prefix.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus { outline: 3px solid #f90; }
  .photo { background: #fff url(/img/photo.png) center / cover; padding: 12px; margin: 16px 0; }
  .photo p { font-size: 16px; margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Frames, details</h1>
  <div class="photo"><p id="fu-between" style="color:#767676">Mid grey text on the page's photo</p></div>
  <iframe src="/frames/between.html" id="fu-frame" title="Photo caption" width="420" height="180" style="border:1px solid #888"></iframe>
  <p><a href="/about.html">About</a></p>
</main>
</body>
</html>
