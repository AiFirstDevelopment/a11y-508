<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lists and short audio - a11y-508 test site</title>
<!--
  Plan item 6. 10.D: a list given another role is not a list; hidden children do not count.
  2.A: autoplaying sound with no controls that lasts 3 seconds or less is a review item; with
  loop, or lasting longer, it is a violation. The WAV files are generated by fixture-site.mjs.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus { outline: 3px solid #f90; }
  [role="tab"] { display: inline-block; padding: 4px 8px; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>Lists and short audio</h1>
  <ul role="tablist" id="list-tablist" aria-label="Views">
    <div role="tab" tabindex="0" aria-selected="true">Summary</div>
    <div role="tab" tabindex="-1" aria-selected="false">Detail</div>
  </ul>
  <ul id="list-hidden-child">
    <li>Visible item</li>
    <div hidden>Hidden helper</div>
  </ul>
  <ul id="list-plain">
    <li>Real item</li>
    <div>Not a list item</div>
  </ul>
  <audio id="audio-short" src="/media/chime-1s.wav" autoplay></audio>
  <audio id="audio-loop" src="/media/chime-1s.wav" autoplay loop></audio>
  <audio id="audio-long" src="/media/tone-10s.wav" autoplay></audio>
  <p>A transcript is not needed: the sounds are silent.</p>
</main>
</body>
</html>
