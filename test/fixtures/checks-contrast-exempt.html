<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contrast exemptions - a11y-508 test site</title>
<!--
  Plan item 3 (13.C). Grey (#aaa on white, 2.32:1) labels of disabled controls are exempt;
  the same label of an enabled control is a violation. A 1:1 text, a single character, and
  text over an absolutely positioned ::before background are review items, not violations.
-->
<style>
  body { font-family: sans-serif; margin: 0; color: #222; background: #fff; }
  header { background: #223; color: #fff; padding: 12px 20px; }
  nav a { color: #fff; margin-right: 16px; }
  main { padding: 20px; max-width: 800px; }
  a:focus, button:focus, [tabindex]:focus { outline: 3px solid #f90; }
  .grey { color: #aaa; }
  label, input { display: block; margin: 6px 0; }
  .same { color: #fff; background: #fff; }
  .char { color: #ccc; font-size: 16px; }
  .pill { position: relative; z-index: 0; display: inline-block; padding: 6px 14px; color: #f5f5f5; }
  .pill::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #1a4480; border-radius: 16px; z-index: -1; }
</style>
</head>
<body>
<header>
  <nav aria-label="Primary">
    <a href="/">Home</a>
    <a href="/forms.html">Forms</a>
    <a href="/tables.html">Tables</a>
    <a href="/media.html">Media</a>
    <a href="/about.html">About</a>
  </nav>
</header>
<main>
  <h1>Contrast exemptions</h1>
  <label for="ex-dis" class="grey" id="ex-dis-label">Email for a disabled field</label>
  <input id="ex-dis" type="text" disabled>
  <label class="grey" id="ex-wrap-label">Phone for a wrapped disabled field <input type="text" disabled></label>
  <span class="grey" id="ex-lb">Text that names a disabled field</span>
  <input type="text" aria-labelledby="ex-lb" disabled>
  <label for="ex-en" class="grey" id="ex-en-label">Email for an enabled field</label>
  <input id="ex-en" type="text">

  <p class="same" id="ex-same">This text is the same color as its background</p>
  <p>Close <span class="char" id="ex-char">x</span></p>
  <p><span class="pill" id="ex-pill">Apply now</span></p>
</main>
</body>
</html>
