name: Fix loop with Gemini CLI (Windows)

# The whole product, end to end, on Windows: crawl the loop test app (test/loop-app/, about ten
# planted Section 508 violations), let the fix loop repair what it can with Gemini CLI on the free
# tier, and check the repairs with the next crawl. Not a required check: the model is
# nondeterministic and the free tier is rate-limited, so test/loop-app/verify.mjs asserts the
# outcome loosely and reports a run refused entirely for quota as SKIPPED.
#
# Needs the repository secret GEMINI_API_KEY (a Google AI Studio key). Without it (a pull request
# from a fork), the job says so and stops green.

on:
  pull_request:
    paths:
      - src/loop.mjs
      - src/agent.mjs
      - src/ledger.mjs
      - test/loop-app/**
      - .github/workflows/loop-gemini.yml
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model for the assistant (a free-tier one)
        required: false
        default: gemini-flash-lite-latest

permissions:
  contents: read

concurrency:
  group: loop-gemini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-gemini:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # A free-tier flash model rather than the CLI's default. Gemini CLI reads GEMINI_MODEL
      # (argv.model || GEMINI_MODEL || settings), so no -m flag is needed. gemini-2.5-flash, the
      # first choice, now answers "no longer available to new users" (404) for this key, and the
      # free daily quota of gemini-3.8-flash, the model that message names, ran out after a few
      # calls; gemini-flash-lite-latest completes a run. workflow_dispatch can pick another.
      GEMINI_MODEL: ${{ inputs.model || 'gemini-flash-lite-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out without CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is the Gemini key available?
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not available to this run (a fork, or the secret is missing); skipping the loop."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Gemini CLI
        if: steps.key.outputs.present == 'true'
        run: |
          npm install -g @google/gemini-cli
          gemini --version
      - name: Make the throwaway repository
        if: steps.key.outputs.present == 'true'
        run: node test/loop-app/setup.mjs "$RUNNER_TEMP/loop-repo" --agent gemini --port 4321
      - name: Does Gemini answer at all? (90 s)
        # One direct call with the loop's environment, so a trust prompt, a model the key cannot use
        # or an exhausted quota shows in seconds rather than after a round of agent calls. Quota
        # makes the run SKIPPED (green); anything else fails it.
        id: preflight
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}\loop-repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: |
          set +e
          timeout 90 gemini -p "Reply with the single word ok." > "$RUNNER_TEMP/preflight.txt" 2>&1
          code=$?
          echo "gemini exit code $code (model $GEMINI_MODEL)"
          grep -v "^Warning: True color\|^Ripgrep" "$RUNNER_TEMP/preflight.txt" | tail -40
          if [ $code -eq 0 ] && grep -qiw ok "$RUNNER_TEMP/preflight.txt"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          elif grep -Eqi '429|RESOURCE_EXHAUSTED|quota|rate.?limit' "$RUNNER_TEMP/preflight.txt"; then
            echo "SKIPPED: Gemini refused the call for quota or rate limit ($GEMINI_MODEL); the loop was not run."
            echo "state=quota" >> "$GITHUB_OUTPUT"
          else
            echo "Gemini CLI did not answer (exit $code); see its output above."
            echo "state=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Run the fix loop, two rounds
        if: steps.preflight.outputs.state == 'ok'
        working-directory: ${{ runner.temp }}\loop-repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The tool keeps its files (the ledger, prompts, logs) outside the repository, under this base.
          A11Y_508_HOME: ${{ runner.temp }}\a11y-508-home
        run: |
          unset TOKEN
          node server.mjs --port 4321 --stoppable > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4321/ > /dev/null || { echo "the loop app's server did not start:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          set +e
          node "$GITHUB_WORKSPACE/bin/a11y-508.mjs" loop --max-rounds 2
          echo "loop exit code $?"
          echo
          node "$GITHUB_WORKSPACE/bin/a11y-508.mjs" status
          work=$(ls -d "$A11Y_508_HOME"/repos/*/work 2>/dev/null | head -1)
          if [ -n "$work" ]; then
            git log --stat --format='--- %h %s' > "$work/git-log.txt"
            cp a11y-508-gate.log "$work/" 2>/dev/null
            cp "$RUNNER_TEMP/preflight.txt" "$work/" 2>/dev/null
          fi
          curl -s http://127.0.0.1:4321/__stop > /dev/null
          exit 0
      - name: Check the outcome
        if: steps.preflight.outputs.state == 'ok'
        env:
          A11Y_508_HOME: ${{ runner.temp }}\a11y-508-home
        run: node test/loop-app/verify.mjs "$RUNNER_TEMP/loop-repo" --rounds 2
      - name: Upload the loop's work directory
        if: always() && steps.preflight.outputs.state == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: loop-gemini-work
          path: ${{ runner.temp }}\a11y-508-home
          if-no-files-found: warn
