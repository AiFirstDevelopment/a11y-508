name: Fix loop with Gemini CLI (Windows)

# The whole product, end to end, on Windows: crawl the loop test app (test/loop-app/, about ten
# planted Section 508 violations), let the fix loop repair what it can with Gemini CLI on the free
# tier, and check the repairs with the next crawl. Not a required check: the model is
# nondeterministic and the free tier is rate-limited, so test/loop-app/verify.mjs asserts the
# outcome loosely and reports a run refused entirely for quota as SKIPPED.
#
# Needs the repository secret GEMINI_API_KEY (a Google AI Studio key). Without it (a pull request
# from a fork), the job says so and stops green.

on:
  pull_request:
    paths:
      - src/loop.mjs
      - src/agent.mjs
      - src/ledger.mjs
      - test/loop-app/**
      - .github/workflows/loop-gemini.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-gemini-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop-gemini:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # A free-tier model rather than the CLI's default. Gemini CLI reads GEMINI_MODEL
      # (argv.model || GEMINI_MODEL || settings), so no -m flag is needed.
      GEMINI_MODEL: gemini-2.5-flash
      REPO_DIR: ${{ runner.temp }}\loop-repo
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out without CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is the Gemini key available?
        id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not available to this run (a fork, or the secret is missing); skipping the loop."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Gemini CLI
        if: steps.key.outputs.present == 'true'
        run: |
          npm install -g @google/gemini-cli
          gemini --version
      - name: Make the throwaway repository
        if: steps.key.outputs.present == 'true'
        run: node test/loop-app/setup.mjs "$REPO_DIR" --agent gemini --port 4321
      - name: Run the fix loop, two rounds
        if: steps.key.outputs.present == 'true'
        working-directory: ${{ runner.temp }}\loop-repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          unset TOKEN
          node server.mjs --port 4321 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4321/ > /dev/null || { echo "the loop app's server did not start:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          set +e
          node "$GITHUB_WORKSPACE/bin/a11y-508.mjs" loop --max-rounds 2
          echo "loop exit code $?"
          echo
          node "$GITHUB_WORKSPACE/bin/a11y-508.mjs" status
          git log --stat --format='--- %h %s' > a11y-508-work/git-log.txt
          cp a11y-508-gate.log a11y-508-work/ 2>/dev/null
          kill $server
          exit 0
      - name: Check the outcome
        if: steps.key.outputs.present == 'true'
        run: node test/loop-app/verify.mjs "$REPO_DIR" --rounds 2
      - name: Upload the loop's work directory
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: loop-gemini-work
          path: ${{ runner.temp }}\loop-repo\a11y-508-work
          if-no-files-found: warn
