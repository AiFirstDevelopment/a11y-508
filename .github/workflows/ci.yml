name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show browser
        run: google-chrome --version
      - name: Run end-to-end test against the fixture site
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-fixture-report-node${{ matrix.node }}
          path: test/.report
          if-no-files-found: ignore

  ui:
    # The dashboard: its own install, typecheck, unit tests, that the committed
    # ui/dist was built from this source, and the Playwright suite against the
    # real server and CLI. The core matrix above runs the server's own tests on
    # Node 18/20/22 as part of npm test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI's dependencies
        run: npm --prefix ui ci
      - name: Typecheck
        run: npm --prefix ui run typecheck
      - name: Unit tests
        run: npm --prefix ui test
      - name: ui/dist matches the source
        run: npm --prefix ui run freshness
      - name: Show browser
        run: google-chrome --version
      - name: Playwright end-to-end suite
        # Sign in opens a visible browser, so it needs a display.
        run: xvfb-run -a npm --prefix ui run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome


  # macOS and Windows each run the core suite and the Playwright suite as two
  # jobs in parallel, so the wall time is the longer half, not the sum.
  macos-core:
    # macOS is where headless Chrome's key-event handling differs: a synthetic
    # key event with a native key code stalled the browser process (see
    # Page.press in src/page.mjs).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show browser
        run: /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version
      - name: Core, loop, remedies and server tests
        run: npm test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-macos-core-report
          path: test/.report
          if-no-files-found: ignore

  macos-ui:
    # The Playwright suite, whose self-audit presses Enter and Escape on every
    # screen. Chrome is preinstalled and the runner has a desktop, so Sign in
    # needs no xvfb.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI's dependencies
        run: npm --prefix ui ci
      - name: Playwright end-to-end suite
        run: npm --prefix ui run e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-macos-ui-reports
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  windows-core:
    # The core suite and the server's tests on Windows: Git Bash as the
    # dashboard's shell, .cmd shims, taskkill for Stop. Chrome and Git for
    # Windows are preinstalled.
    runs-on: windows-latest
    steps:
      - name: Check out without CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show browser and Git Bash
        run: |
          (Get-Item "C:\Program Files\Google\Chrome\Application\chrome.exe").VersionInfo.ProductVersion
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
      - name: Core, loop, remedies and server tests
        run: npm test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-windows-core-report
          path: test/.report
          if-no-files-found: ignore

  windows-ui:
    # The Playwright suite on Windows: cmd /c start for the browser, the
    # runner's desktop for Sign in.
    runs-on: windows-latest
    steps:
      - name: Check out without CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the UI's dependencies
        run: npm --prefix ui ci
      - name: Playwright end-to-end suite
        run: npm --prefix ui run e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-windows-ui-reports
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
