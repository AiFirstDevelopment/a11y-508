name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show browser
        run: google-chrome --version
      - name: Run end-to-end test against the fixture site
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-508-fixture-report-node${{ matrix.node }}
          path: test/.report
          if-no-files-found: ignore
